name: geostat-py
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - pandas
  - scipy
  - matplotlib
  - pip
  - customtkinter
  # Optional 3D backend components (recommended for desktop builds):
  - plotly
  # PyVista/VTK can be heavy in some Windows setups; install if needed:
  # - pyvista
  # - vtk
  # Optional acceleration:
  # - numba
  - pip:
      - -e .
